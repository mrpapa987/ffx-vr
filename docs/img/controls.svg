<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1680" width="2000" height="1680" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">FFX VR controls: the buttons</title>
<desc id="d">Two schematic VR controllers with every button labelled: what each does in the field and in battle.</desc>
<rect width="2000" height="1680" fill="#17212b"/>
<text x="40" y="70" font-size="46" fill="#eef3f8" font-weight="bold">FFX VR controls: the buttons</text>
<text x="40" y="116" font-size="26" fill="#b4c2d0">The two VR controllers act as the gamepad (F8 &gt; Controls &gt; "Use the Quest controllers as the gamepad", on by default).</text>
<text x="40" y="152" font-size="26" fill="#b4c2d0">Schematic drawing, not to scale: match the numbers. The chords and gestures the mod adds are on the second sheet (controls-chords).</text>
<text x="845" y="230" font-size="32" fill="#b4c2d0" font-weight="bold" text-anchor="middle">LEFT</text>
<text x="1155" y="230" font-size="32" fill="#b4c2d0" font-weight="bold" text-anchor="middle">RIGHT</text>
<rect x="40" y="200" width="610" height="216" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="40" y="200" width="10" height="216" rx="5" fill="#f2a541"/>
<text x="118" y="244" font-size="30" fill="#f2a541" font-weight="bold">Left trigger = LT</text>
<circle cx="87.0" cy="234.0" r="19" fill="#f2a541" stroke="#17212b" stroke-width="3"/><text x="87.0" y="241.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">1</text>
<text x="68" y="287" font-size="24" fill="#b4c2d0" font-weight="bold">Battle</text>
<text x="200" y="287" font-size="27" fill="#eef3f8">previous character in the</text>
<text x="200" y="323" font-size="27" fill="#eef3f8">switch list</text>
<text x="68" y="359" font-size="24" fill="#b4c2d0" font-weight="bold">F8 panel</text>
<text x="200" y="359" font-size="27" fill="#eef3f8">click (when this hand points at</text>
<text x="200" y="395" font-size="27" fill="#eef3f8">the panel)</text>
<rect x="40" y="434" width="610" height="252" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="40" y="434" width="10" height="252" rx="5" fill="#6fb1ff"/>
<text x="118" y="478" font-size="30" fill="#6fb1ff" font-weight="bold">Left stick</text>
<circle cx="87.0" cy="468.0" r="19" fill="#6fb1ff" stroke="#17212b" stroke-width="3"/><text x="87.0" y="475.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">2</text>
<text x="68" y="521" font-size="24" fill="#b4c2d0" font-weight="bold">Field</text>
<text x="166" y="521" font-size="27" fill="#eef3f8">walk; in first person, relative to</text>
<text x="166" y="557" font-size="27" fill="#eef3f8">where you look</text>
<text x="68" y="593" font-size="24" fill="#b4c2d0" font-weight="bold">Battle</text>
<text x="166" y="593" font-size="27" fill="#eef3f8">menus and targets, as on a</text>
<text x="166" y="629" font-size="27" fill="#eef3f8">gamepad</text>
<text x="68" y="665" font-size="24" fill="#b4c2d0" font-weight="bold">Click</text>
<text x="166" y="665" font-size="27" fill="#eef3f8">Back (Select)</text>
<rect x="40" y="704" width="610" height="216" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="40" y="704" width="10" height="216" rx="5" fill="#f08fb8"/>
<text x="118" y="748" font-size="30" fill="#f08fb8" font-weight="bold">X and Y buttons</text>
<circle cx="87.0" cy="738.0" r="19" fill="#f08fb8" stroke="#17212b" stroke-width="3"/><text x="87.0" y="745.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">3</text>
<text x="68" y="791" font-size="24" fill="#b4c2d0" font-weight="bold">X</text>
<text x="102" y="791" font-size="27" fill="#eef3f8">the game's X (square on a PlayStation</text>
<text x="102" y="827" font-size="27" fill="#eef3f8">pad)</text>
<text x="68" y="863" font-size="24" fill="#b4c2d0" font-weight="bold">Y</text>
<text x="102" y="863" font-size="27" fill="#eef3f8">the game's Y (triangle): the main</text>
<text x="102" y="899" font-size="27" fill="#eef3f8">menu in the field, Defend in battle</text>
<rect x="40" y="938" width="610" height="252" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="40" y="938" width="10" height="252" rx="5" fill="#c7b0ff"/>
<text x="118" y="982" font-size="30" fill="#c7b0ff" font-weight="bold">Menu button = Start</text>
<circle cx="87.0" cy="972.0" r="19" fill="#c7b0ff" stroke="#17212b" stroke-width="3"/><text x="87.0" y="979.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">4</text>
<text x="68" y="1025" font-size="24" fill="#b4c2d0" font-weight="bold">Press</text>
<text x="159" y="1025" font-size="27" fill="#eef3f8">pause. With the left grip already</text>
<text x="159" y="1061" font-size="27" fill="#eef3f8">held: opens or closes the F8 menu</text>
<text x="159" y="1097" font-size="27" fill="#eef3f8">instead.</text>
<text x="68" y="1133" font-size="24" fill="#b4c2d0" font-weight="bold">Avoid</text>
<text x="159" y="1133" font-size="27" fill="#eef3f8">a long press or a double tap: that</text>
<text x="159" y="1169" font-size="27" fill="#eef3f8">is Virtual Desktop's own menu</text>
<rect x="40" y="1208" width="610" height="216" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="40" y="1208" width="10" height="216" rx="5" fill="#52c7a6"/>
<text x="118" y="1252" font-size="30" fill="#52c7a6" font-weight="bold">Left grip = LB (L1)</text>
<circle cx="87.0" cy="1242.0" r="19" fill="#52c7a6" stroke="#17212b" stroke-width="3"/><text x="87.0" y="1249.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">5</text>
<text x="68" y="1295" font-size="24" fill="#b4c2d0" font-weight="bold">Field</text>
<text x="166" y="1295" font-size="27" fill="#eef3f8">first / third person: LB at once</text>
<text x="68" y="1331" font-size="24" fill="#b4c2d0" font-weight="bold">Battle</text>
<text x="166" y="1331" font-size="27" fill="#eef3f8">quick squeeze: switch characters</text>
<text x="166" y="1367" font-size="27" fill="#eef3f8">(opens the list, then the next</text>
<text x="166" y="1403" font-size="27" fill="#eef3f8">one); held: chords</text>
<rect x="1350" y="200" width="610" height="216" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="1350" y="200" width="10" height="216" rx="5" fill="#f2a541"/>
<text x="1428" y="244" font-size="30" fill="#f2a541" font-weight="bold">Right trigger = RT</text>
<circle cx="1397.0" cy="234.0" r="19" fill="#f2a541" stroke="#17212b" stroke-width="3"/><text x="1397.0" y="241.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">6</text>
<text x="1378" y="287" font-size="24" fill="#b4c2d0" font-weight="bold">Battle</text>
<text x="1510" y="287" font-size="27" fill="#eef3f8">hold: scroll the turn order</text>
<text x="1510" y="323" font-size="27" fill="#eef3f8">forward</text>
<text x="1378" y="359" font-size="24" fill="#b4c2d0" font-weight="bold">F8 panel</text>
<text x="1510" y="359" font-size="27" fill="#eef3f8">click (when this hand points at</text>
<text x="1510" y="395" font-size="27" fill="#eef3f8">the panel)</text>
<rect x="1350" y="434" width="610" height="288" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="1350" y="434" width="10" height="288" rx="5" fill="#6fb1ff"/>
<text x="1428" y="478" font-size="30" fill="#6fb1ff" font-weight="bold">Right stick</text>
<circle cx="1397.0" cy="468.0" r="19" fill="#6fb1ff" stroke="#17212b" stroke-width="3"/><text x="1397.0" y="475.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">7</text>
<text x="1378" y="521" font-size="24" fill="#b4c2d0" font-weight="bold">3D views</text>
<text x="1516" y="521" font-size="27" fill="#eef3f8">turn left / right, smoothly</text>
<text x="1516" y="557" font-size="27" fill="#eef3f8">(speed: F8 &gt; Controls &gt;</text>
<text x="1516" y="593" font-size="27" fill="#eef3f8">Turning)</text>
<text x="1378" y="629" font-size="24" fill="#b4c2d0" font-weight="bold">F8 panel</text>
<text x="1516" y="629" font-size="27" fill="#eef3f8">scroll</text>
<text x="1378" y="665" font-size="24" fill="#b4c2d0" font-weight="bold">Click</text>
<text x="1516" y="665" font-size="27" fill="#eef3f8">R3; with a grip held, a chord</text>
<text x="1516" y="701" font-size="27" fill="#eef3f8">(second sheet)</text>
<rect x="1350" y="740" width="610" height="144" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="1350" y="740" width="10" height="144" rx="5" fill="#f08fb8"/>
<text x="1428" y="784" font-size="30" fill="#f08fb8" font-weight="bold">A and B buttons</text>
<circle cx="1397.0" cy="774.0" r="19" fill="#f08fb8" stroke="#17212b" stroke-width="3"/><text x="1397.0" y="781.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">8</text>
<text x="1378" y="827" font-size="24" fill="#b4c2d0" font-weight="bold">A</text>
<text x="1413" y="827" font-size="27" fill="#eef3f8">confirm: talk, examine, open, choose</text>
<text x="1378" y="863" font-size="24" fill="#b4c2d0" font-weight="bold">B</text>
<text x="1413" y="863" font-size="27" fill="#eef3f8">cancel / back</text>
<rect x="1350" y="902" width="610" height="180" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="1350" y="902" width="10" height="180" rx="5" fill="#d9d9d9"/>
<text x="1428" y="946" font-size="30" fill="#d9d9d9" font-weight="bold">System button (Meta)</text>
<circle cx="1397.0" cy="936.0" r="19" fill="#d9d9d9" stroke="#17212b" stroke-width="3"/><text x="1397.0" y="943.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">9</text>
<text x="1378" y="989" font-size="24" fill="#b4c2d0" font-weight="bold">Hold</text>
<text x="1456" y="989" font-size="27" fill="#eef3f8">recentre the view (the headset's</text>
<text x="1456" y="1025" font-size="27" fill="#eef3f8">own recentre; Home on the</text>
<text x="1456" y="1061" font-size="27" fill="#eef3f8">keyboard does the same)</text>
<rect x="1350" y="1100" width="610" height="180" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<rect x="1350" y="1100" width="10" height="180" rx="5" fill="#52c7a6"/>
<text x="1428" y="1144" font-size="30" fill="#52c7a6" font-weight="bold">Right grip = RB (R1)</text>
<circle cx="1397.0" cy="1134.0" r="19" fill="#52c7a6" stroke="#17212b" stroke-width="3"/><text x="1397.0" y="1141.6" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">10</text>
<text x="1378" y="1187" font-size="24" fill="#b4c2d0" font-weight="bold">Field</text>
<text x="1476" y="1187" font-size="27" fill="#eef3f8">first / third person: RB at once</text>
<text x="1378" y="1223" font-size="24" fill="#b4c2d0" font-weight="bold">Battle</text>
<text x="1476" y="1223" font-size="27" fill="#eef3f8">quick squeeze: one row back in</text>
<text x="1476" y="1259" font-size="27" fill="#eef3f8">the turn order; held: chords</text>
<g transform="rotate(12 845.0 700.0)"><rect x="777.4" y="752.0" width="135.2" height="377.0" rx="65.0" fill="#2c3b4d" stroke="#8ea3b8" stroke-width="3.9"/><rect x="751.4" y="895.0" width="33.8" height="143.0" rx="15.6" fill="#52c7a6" stroke="#52c7a6" stroke-width="3.9"/></g>
