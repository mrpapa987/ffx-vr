<text x="806.0" y="778.0" font-size="31" font-weight="bold" text-anchor="middle" fill="#17212b">X</text>
<circle cx="761.8" cy="705.2" r="27.3" fill="#f08fb8" stroke="#f08fb8" stroke-width="3.9"/>
<text x="761.8" y="715.6" font-size="31" font-weight="bold" text-anchor="middle" fill="#17212b">Y</text>
<circle cx="897.0" cy="780.6" r="16.9" fill="#c7b0ff" stroke="#c7b0ff" stroke-width="3.9"/>
<line x1="887.9" y1="774.1" x2="906.1" y2="774.1" stroke="#17212b" stroke-width="2.6"/>
<line x1="887.9" y1="780.6" x2="906.1" y2="780.6" stroke="#17212b" stroke-width="2.6"/>
