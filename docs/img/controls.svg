<line x1="903.0" y1="842.6" x2="897.0" y2="796.6" stroke="#c7b0ff" stroke-width="3"/>
<circle cx="903.0" cy="842.6" r="19" fill="#c7b0ff" stroke="#17212b" stroke-width="3"/><text x="903.0" y="850.2" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">4</text>
<line x1="669.8" y1="954.8" x2="701.8" y2="954.8" stroke="#52c7a6" stroke-width="3"/>
<circle cx="669.8" cy="954.8" r="19" fill="#52c7a6" stroke="#17212b" stroke-width="3"/><text x="669.8" y="962.4" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">5</text>
<circle cx="1222.6" cy="535.5" r="19" fill="#f2a541" stroke="#17212b" stroke-width="3"/><text x="1222.6" y="543.1" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">6</text>
<circle cx="1105.6" cy="655.8" r="21" fill="#6fb1ff" stroke="#17212b" stroke-width="3"/><text x="1105.6" y="664.2" font-size="24" font-weight="bold" text-anchor="middle" fill="#17212b">7</text>
<line x1="1294.1" y1="780.4" x2="1214.0" y2="779.6" stroke="#f08fb8" stroke-width="3"/>
<line x1="1294.1" y1="780.4" x2="1250.2" y2="727.2" stroke="#f08fb8" stroke-width="3"/>
<circle cx="1294.1" cy="780.4" r="19" fill="#f08fb8" stroke="#17212b" stroke-width="3"/><text x="1294.1" y="788.0" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">8</text>
<line x1="1097.0" y1="842.6" x2="1103.0" y2="796.6" stroke="#d9d9d9" stroke-width="3"/>
<circle cx="1097.0" cy="842.6" r="19" fill="#d9d9d9" stroke="#17212b" stroke-width="3"/><text x="1097.0" y="850.2" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">9</text>
<line x1="1330.2" y1="954.8" x2="1298.2" y2="954.8" stroke="#52c7a6" stroke-width="3"/>
<circle cx="1330.2" cy="954.8" r="19" fill="#52c7a6" stroke="#17212b" stroke-width="3"/><text x="1330.2" y="962.4" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">10</text>
<rect x="40" y="1448" width="1920" height="192" rx="14" fill="#223041" stroke="#3d5169" stroke-width="2"/>
<text x="62" y="1496" font-size="25" fill="#b4c2d0" font-weight="bold">Seat and diorama views</text>
<text x="442" y="1496" font-size="25" fill="#eef3f8">a held grip grabs the world instead of pressing LB / RB; a quick squeeze (under 0.3 s, hand still) is still LB / RB.</text>
<text x="62" y="1536" font-size="25" fill="#b4c2d0" font-weight="bold">Triggers</text>
<text x="442" y="1536" font-size="25" fill="#eef3f8">count as pressed from about 12 % of their travel, so a resting finger presses nothing.</text>
<text x="62" y="1576" font-size="25" fill="#b4c2d0" font-weight="bold">Keyboard</text>
<text x="442" y="1576" font-size="25" fill="#eef3f8">F8 the FFX VR menu · Home recentre · End next view · Insert next party member (battle) · Numpad 1 / 3 turn.</text>
<text x="62" y="1616" font-size="25" fill="#b4c2d0" font-weight="bold">Also works</text>
<text x="442" y="1616" font-size="25" fill="#eef3f8">a normal gamepad, merged with the controllers. Fahrenheit's save / load screen: left stick, A / B, grips page the list.</text>
</svg>
