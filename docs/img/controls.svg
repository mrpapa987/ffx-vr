<rect x="1168.0" y="515.4" width="109.2" height="91.0" rx="26.0" fill="#f2a541" stroke="#f2a541" stroke-width="3.9"/>
<circle cx="1155.0" cy="700.0" r="145.6" fill="#2c3b4d" stroke="#8ea3b8" stroke-width="3.9"/>
<circle cx="1105.6" cy="655.8" r="49.4" fill="none" stroke="#6fb1ff" stroke-width="3.9"/><circle cx="1105.6" cy="655.8" r="28.6" fill="#6fb1ff" stroke="#6fb1ff" stroke-width="3.9"/>
<circle cx="1194.0" cy="767.6" r="27.3" fill="#f08fb8" stroke="#f08fb8" stroke-width="3.9"/>
<text x="1194.0" y="778.0" font-size="31" font-weight="bold" text-anchor="middle" fill="#17212b">A</text>
<circle cx="1238.2" cy="705.2" r="27.3" fill="#f08fb8" stroke="#f08fb8" stroke-width="3.9"/>
<text x="1238.2" y="715.6" font-size="31" font-weight="bold" text-anchor="middle" fill="#17212b">B</text>
<circle cx="1103.0" cy="780.6" r="16.9" fill="#d9d9d9" stroke="#d9d9d9" stroke-width="3.9"/>
<circle cx="777.4" cy="535.5" r="19" fill="#f2a541" stroke="#17212b" stroke-width="3"/><text x="777.4" y="543.1" font-size="22" font-weight="bold" text-anchor="middle" fill="#17212b">1</text>
<circle cx="894.4" cy="655.8" r="21" fill="#6fb1ff" stroke="#17212b" stroke-width="3"/><text x="894.4" y="664.2" font-size="24" font-weight="bold" text-anchor="middle" fill="#17212b">2</text>
<line x1="705.9" y1="780.4" x2="786.0" y2="779.6" stroke="#f08fb8" stroke-width="3"/>
<line x1="705.9" y1="780.4" x2="749.8" y2="727.2" stroke="#f08fb8" stroke-width="3"/>
