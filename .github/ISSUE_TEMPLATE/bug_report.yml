name: Bug report
description: Something in FFX VR doesn't work or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing FFX VR. Please report FFX VR problems **here only**, not to the Fahrenheit or
        FFX-60fps projects. Search the [existing issues](https://github.com/mrpapa987/ffx-vr/issues?q=is%3Aissue) first.

        The quickest reports to fix come with logs: start the game with `tools\run-ffx.ps1`, reproduce the
        problem, quit through the game's menu, then attach the newest `logs\run-*.txt` and the
        `logs\run-*-gamelogs` folder (zipped).
  - type: input
    id: mod_version
    attributes:
      label: FFX VR version
      description: Shown at the bottom of the F8 overlay (e.g. "FFX VR 0.1.0-alpha.1+e6e10f9"), or the zip's name.
    validations:
      required: true
  - type: input
    id: fahrenheit
    attributes:
      label: Fahrenheit version
      description: '`tools\install-mod.ps1` prints it, e.g. "1.0.0-alpha12 (7e85839, official release)".'
    validations:
      required: true
  - type: dropdown
    id: fps60
    attributes:
      label: FFX-60fps
      options: ['Installed, fps=60', 'Installed, other fps', 'Not installed', "Don't know"]
    validations:
      required: true
  - type: dropdown
    id: textures
    attributes:
      label: HD texture pack (Re-Remastered)
      options: ['Not installed', 'Installed', 'Installed, compressed (-Compress)']
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset, runtime and Virtual Desktop settings
      description: Headset model; Virtual Desktop version; OpenXR runtime (VDXR?); refresh rate (72 / 90 / 120 Hz); SSW setting; quality preset.
      placeholder: Quest 3, Virtual Desktop 1.34, VDXR, 120 Hz, SSW Disabled, Ultra
    validations:
      required: true
  - type: input
    id: pc
    attributes:
      label: PC
      description: GPU, Windows version, the game's resolution and V-Sync setting.
      placeholder: RTX 3080 Ti, Windows 11 24H2, 2560x1440, V-Sync off
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Where in the game (area, battle, cutscene), which view (first person, third person, diorama, screen).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the save in ...
        2. Switch to first person
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Drag in the zipped `logs\run-*-gamelogs` folder and the `logs\run-*.txt` of that run (or, without
        run-ffx, `ffxvr_diag.log`, `ffxvr_diag.prev.log` and `ffxvr_native.log` from
        `<game>\fahrenheit\mods\ffxvr\`, and Fahrenheit's newest `fahrenheit\logs\` folder). If asked for more
        detail: with the game closed run `tools\set-logging.ps1 -Profile Verbose`, reproduce, attach the logs, then
        `tools\set-logging.ps1 -Profile Release`.
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a clip (optional)
